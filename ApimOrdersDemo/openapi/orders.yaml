openapi: 3.0.3
info:
  title: Orders API
  description: Order intake for partner shops. Served by an Azure Functions app behind API Management.
  version: 1.0.0
servers:
  # APIM replaces this with the API's serviceUrl on import.
  - url: https://func-orders.azurewebsites.net/api
paths:
  /orders:
    get:
      operationId: list-orders
      summary: List orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Orders, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      operationId: create-order
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order accepted.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
  /orders/{orderId}:
    get:
      operationId: get-order
      summary: Get one order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No order with that id.
components:
  schemas:
    OrderStatus:
      type: string
      enum: [Pending, Shipped, Cancelled]
    OrderLine:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku:
          type: string
          example: BOOK-0042
        quantity:
          type: integer
          minimum: 1
          example: 2
        unitPrice:
          type: number
          format: decimal
          example: 24.90
    CreateOrderRequest:
      type: object
      required: [customerId, lines]
      properties:
        customerId:
          type: string
          example: C-1001
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
    Order:
      type: object
      properties:
        orderId:
          type: string
          example: ORD-7F3A9C21
        customerId:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          type: number
          format: decimal
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
    ValidationProblem:
      type: object
      properties:
        title:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
