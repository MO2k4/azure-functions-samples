# Azure secret store: Key Vault. Referenced by pubsub.servicebus.yaml through auth.secretStore,
# so the Service Bus connection string stays out of the component YAML.
#
# There is no key or connection-string mode for this component: Microsoft Entra ID is the only
# supported authentication. Key Vault Secrets User is the minimum role (it carries the Get
# secrets permission); create the vault with --enable-rbac-authorization true.
#
# Naming: Azure allows 1 to 127 characters, alphanumerics and hyphens only, in a secret name.
# A config key such as ConnectionStrings:Orders therefore cannot be a secret name. Dapr does no
# name translation and no JSON flattening for Key Vault: a JSON secret value comes back as one
# opaque string and your app parses it. The Section--Name to Section:Name convention belongs to
# the ASP.NET Core Key Vault configuration provider, not to Dapr.
#
# Scoping caveat: every secret in this vault is readable by the Dapr apps by default. Narrowing
# that needs a secrets.scopes policy on a Dapr Configuration resource, and Azure Container Apps
# does not expose the Configuration spec at all. Give the app its own vault instead.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: ordersecrets
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
    - name: vaultName
      value: kv-orders
    # Required for a user-assigned managed identity; omit it for a system-assigned one.
    # It has no effect under AKS workload identity.
    - name: azureClientId
      value: "<user-assigned-managed-identity-client-id>"
    # Without this, the credential chain is tried in order (client credentials, client
    # certificate, workload identity, SPIFFE, managed identity, Azure CLI). On a laptop where
    # `az login` succeeded that falls through to the CLI credential and the component "works",
    # hiding a managed identity that was never configured. Pinning the method makes that a
    # loud failure instead.
    - name: azureAuthMethods
      value: "managedidentity"
scopes:
  - orders-api
  - shipping-api
