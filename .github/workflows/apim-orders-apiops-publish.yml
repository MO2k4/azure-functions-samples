name: ApimOrdersDemo APIOps publish

on:
  # No paths filter on pull_request: a required check from a path-filtered workflow stays Pending
  # on every PR that doesn't match. The changes job decides instead, and a skipped job counts as passed.
  pull_request:
  push:
    branches: [main]
    paths: ['ApimOrdersDemo/apiops/**']
  # Full publish without --commit-id, to reconcile prod after a rejected or cancelled run.
  workflow_dispatch:

permissions:
  contents: read

# --commit-id diffs that commit against its parent. On a PR that is the merge commit against the base
# branch; on main it is the merged commit, so merge or squash PRs (a rebase merge only publishes the last commit).
# Never add --delete-unmatched here: Bicep owns the rest of the instance, and that flag would delete it.
env:
  APIOPS_CLI: '@azure-tools/apiops-cli@1.0.5'

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      apiops: ${{ steps.diff.outputs.apiops }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: diff
        run: |
          if git diff --quiet HEAD~1 HEAD -- ApimOrdersDemo/apiops; then
            echo "apiops=false" >> "$GITHUB_OUTPUT"
          else
            echo "apiops=true" >> "$GITHUB_OUTPUT"
          fi

  # Required check, next to dry-run. Needs no Azure: no id-token, no environment, no variables.
  validate:
    needs: changes
    if: needs.changes.outputs.apiops == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApimOrdersDemo/apiops
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Lint the OpenAPI specs
        run: npx --yes @stoplight/spectral-cli@6.17.1 lint --ruleset .spectral.yaml 'apim-artifacts/apis/*/specification.yaml'

      - name: Check the policies
        run: node ../scripts/check-policies.mjs apim-artifacts

      # A spec the base branch doesn't have is a new API or version: nothing to break.
      - name: Breaking changes against the base branch
        run: |
          for spec in apim-artifacts/apis/*/specification.yaml; do
            if ! git cat-file -e "HEAD~1:./$spec" 2>/dev/null; then
              echo "$spec: new, skipped"
              continue
            fi
            git show "HEAD~1:./$spec" > "$RUNNER_TEMP/base.yaml"
            docker run --rm -v "$PWD:/head:ro" -v "$RUNNER_TEMP:/base:ro" tufin/oasdiff:v1.35.0 \
              breaking /base/base.yaml "/head/$spec" --fail-on ERR
          done

  # Required check, next to validate. No environment, so the token subject is pull_request and the identity
  # has only Reader. With dev and prod limited to main, a PR that edits this file can't publish before review.
  dry-run:
    needs: changes
    if: needs.changes.outputs.apiops == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ApimOrdersDemo/apiops
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.APIOPS_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Dry run against dev
        run: >
          npx --yes "$APIOPS_CLI" publish
          --subscription-id ${{ vars.AZURE_SUBSCRIPTION_ID }}
          --resource-group ${{ vars.APIM_DEV_RESOURCE_GROUP }}
          --service-name ${{ vars.APIM_DEV_SERVICE_NAME }}
          --source apim-artifacts
          --commit-id ${{ github.sha }}
          --dry-run

      - name: Dry run against prod with the prod overrides
        run: >
          npx --yes "$APIOPS_CLI" publish
          --subscription-id ${{ vars.AZURE_SUBSCRIPTION_ID }}
          --resource-group ${{ vars.APIM_PROD_RESOURCE_GROUP }}
          --service-name ${{ vars.APIM_PROD_SERVICE_NAME }}
          --source apim-artifacts
          --overrides configuration.prod.yaml
          --commit-id ${{ github.sha }}
          --dry-run

  publish-dev:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: apiops-publish-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ApimOrdersDemo/apiops
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: >
          npx --yes "$APIOPS_CLI" publish
          --subscription-id ${{ vars.AZURE_SUBSCRIPTION_ID }}
          --resource-group ${{ vars.APIM_DEV_RESOURCE_GROUP }}
          --service-name ${{ vars.APIM_DEV_SERVICE_NAME }}
          --source apim-artifacts
          ${{ github.event_name == 'push' && format('--commit-id {0}', github.sha) || '' }}

  # The prod environment has required reviewers, so this job waits for an approval after dev succeeded.
  publish-prod:
    needs: publish-dev
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: apiops-publish-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ApimOrdersDemo/apiops
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: >
          npx --yes "$APIOPS_CLI" publish
          --subscription-id ${{ vars.AZURE_SUBSCRIPTION_ID }}
          --resource-group ${{ vars.APIM_PROD_RESOURCE_GROUP }}
          --service-name ${{ vars.APIM_PROD_SERVICE_NAME }}
          --source apim-artifacts
          --overrides configuration.prod.yaml
          ${{ github.event_name == 'push' && format('--commit-id {0}', github.sha) || '' }}
